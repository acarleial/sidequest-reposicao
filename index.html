<style>
/* VOICE: ferramenta de bolso para a rota de reposição — direta, operacional, sem enfeite
   IDEA: a frente da vending machine — gavetas e molas, cada uma com seu nível
   PICTURE: o painel da máquina, gaveta por gaveta, com o estoque estimado e quanto levar em cada mola
   COLOUR and TYPE: marca SideQuest — preto/carvão, branco, ouro queimado; Montserrat 800 + Inter
   LAYOUT: máquina no topo, lista de separação com números grandes pendurados, alertas, depois mix e ajustes */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e0e0e);--ink:light-dark(#151515,#f1efe9);--mute:light-dark(#6b6a66,#9d9a93);
--line:light-dark(#e4e2dc,#2a2927);--panel:light-dark(#f4f3ef,#181817);--char:light-dark(#1b1b1b,#232322);
--gold:light-dark(#9a6a1f,#cf9d4a);--goldbg:light-dark(#f6ecd9,#2e2416);--red:light-dark(#b3261e,#ff7a6b);--redbg:light-dark(#fbe6e3,#3a1a17)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;font-weight:800;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4.4vw,40px)}h2{font-size:22px;margin-bottom:10px}h3{font-size:16px}
.band{padding:clamp(18px,3vw,36px) max(4vw,16px)}.wrap{max-width:1240px;margin:0 auto}
.top{background:var(--char);color:#f1efe9}.top .mute{color:#a9a69e}
.brand{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}

button.b,label.b{font:600 15px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#a9a69e;margin-top:8px}

.legend b{display:inline-block;width:2px;height:12px;background:#cf9d4a;vertical-align:middle;margin-right:4px}
.pick{list-style:none;margin:0;padding:0;border-top:3px solid var(--ink)}

.card{background:var(--panel);border-radius:12px;padding:14px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}.detail dt{color:var(--mute);font-size:14px}.detail dd{margin:0;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:13px}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--goldbg);color:var(--gold);font-weight:600;white-space:nowrap}
.tag.r{background:var(--redbg);color:var(--red)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet>div{background:var(--bg);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(4vw,16px) 24px}
.erows{display:grid;gap:6px;margin:12px 0}
.erow{display:grid;grid-template-columns:44px minmax(0,1fr) 84px;gap:8px;align-items:center}
.erow .c{font:800 15px Montserrat,sans-serif}
.section{margin-top:28px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.status{font-size:13px;margin-top:8px;color:#a9a69e}
.gedit{display:grid;grid-template-columns:90px 110px 80px minmax(0,1fr);gap:8px;align-items:center;margin:6px 0}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}.gedit{grid-template-columns:1fr 1fr}.pick li{grid-template-columns:60px minmax(0,1fr)}.pick .num{font-size:28px}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<body>
<header class="top band">
 <div class="wrap">
  <div class="brand"><h1>Reposição das máquinas</h1><small>SideQuest · Vending</small></div>
  <div class="status" id="status">Carregando dados…</div>
  <div class="chips" id="chips"></div>
  <nav class="tabs" id="tabs"><a href="#visita">Próxima visita</a><a href="#mix">Mix de produtos</a><a href="#ajustes">Ajustes</a></nav>
 </div>
</header>
<main class="band"><div class="wrap" id="main"></div></main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div id="shBody"></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, addDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const CFG = { apiKey: "AIzaSyCQALaocRiFbJ0vUUWlb0WE69qCFsJrpKk", authDomain: "sidequest-reposicao.firebaseapp.com", projectId: "sidequest-reposicao", storageBucket: "sidequest-reposicao.firebasestorage.app", messagingSenderId: "542444911121", appId: "1:542444911121:web:bed612177980e0fec14fb0" };
{
// Motor do planejador — tempos em minutos desde 2026-01-01 00:00 (hora local, sem fuso)
const EPOCH = Date.UTC(2026, 0, 1);
const DIA = 1440;
const TAXA = 0.012; // taxa média de pagamento
function nowMin() { const d = new Date(); return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()) - EPOCH) / 60000); }
function toDate(t) { return new Date(EPOCH + t * 60000); }
function fmtD(t) { const d = toDate(t); return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0'); }
function isoToMin(s) { const [y, m, d] = s.split('-').map(Number); return Math.round((Date.UTC(y, m - 1, d) - EPOCH) / 60000); }
function minToIso(t) { return toDate(t).toISOString().slice(0, 10); }

function catPorPreco(produtos, preco) {
  let best = null;
  for (const [id, p] of Object.entries(produtos)) if (p.generico && Math.abs(p.preco - preco) < 0.2) best = id;
  if (!best) for (const [id, p] of Object.entries(produtos)) if (Math.abs(p.preco - preco) < 0.2) { best = id; break; }
  return best || ('preco:' + preco);
}
function mesmoPreco(produtos, id, preco) { const p = produtos[id]; return p && Math.abs(p.preco - preco) < 0.2; }
function canaletasDe(maq) { const out = []; for (const g of maq.gavetas || []) for (const c of g.can) out.push({ can: c, cap: g.cap, tipo: g.tipo, gaveta: g.nome }); return out; }

// Monta, para uma máquina, as vendas por canaleta já com o produto atribuído
function vendasDaMaquina(st, m) {
  const ev = st.eventos.filter(e => e.maq === m).sort((a, b) => a.t - b.t);
  const plano = (st.maquinas[m] || {}).plano || {};
  const out = {};
  for (const doc of st.vendas) if (doc.maq === m) for (const [t, can, preco] of doc.v) {
    let prod = null;
    for (let i = ev.length - 1; i >= 0; i--) if (ev[i].t <= t && ev[i].produtos && ev[i].produtos[can]) { prod = ev[i].produtos[can]; break; }
    if (!prod || !mesmoPreco(st.produtos, prod, preco)) prod = (!ev.length && plano[can] && mesmoPreco(st.produtos, plano[can], preco)) ? plano[can] : catPorPreco(st.produtos, preco);
    (out[can] = out[can] || []).push({ t, preco, prod });
  }
  for (const k in out) out[k].sort((a, b) => a.t - b.t);
  return { porCan: out, eventos: ev };
}

function fimDados(st) { let f = 0; for (const d of st.vendas) for (const x of d.v) if (x[0] > f) f = x[0]; return f; }

// Velocidade de uma canaleta para o produto que está nela hoje
function statsCanaleta(st, m, can, prodAtual, vm, fim) {
  const cfg = st.cfg, W = (cfg.janelaDias || 21) * DIA;
  let ini = fim - W;
  const evs = vm.eventos;
  // se o produto da canaleta mudou dentro da janela, conta só desde a troca
  for (const e of evs) if (e.produtos && e.produtos[can] && e.t > ini && e.t <= fim) {
    const antes = evs.filter(x => x.t < e.t && x.produtos && x.produtos[can]).pop();
    if (antes && antes.produtos[can] !== e.produtos[can]) ini = e.t;
  }
  const inst = (st.maquinas[m] || {}).instalada; if (inst) ini = Math.max(ini, isoToMin(inst));
  const todas = vm.porCan[can] || [];
  const vend = todas.filter(v => v.t > ini && v.t <= fim && (!prodAtual || v.prod === prodAtual));
  // períodos vazios pelos registros de reposição/contagem
  let vazio = 0;
  const evCan = evs.filter(e => e.niveis && e.niveis[can] != null);
  for (let i = 0; i < evCan.length; i++) {
    const e = evCan[i], prox = i + 1 < evCan.length ? evCan[i + 1].t : fim;
    let n = +e.niveis[can], tz = null;
    if (n <= 0) tz = e.t; else { let c = 0; for (const v of todas) if (v.t > e.t && v.t <= prox) { c++; if (c >= n) { tz = v.t; break; } } }
    if (tz != null) { const a = Math.max(tz, ini), b = Math.min(prox, fim); if (b > a) vazio += b - a; }
  }
  let dias = (fim - ini) / DIA, n = vend.length, ult = todas.length ? todas[todas.length - 1].t : null;
  let provVazia = false, vaziaDesde = null;
  // antes do primeiro registro: mola que parou de vender de repente conta como vazia
  const primeiro = evCan.find(e => e.t > ini);
  const segFim = Math.min(fim, primeiro ? primeiro.t : fim);
  if (!evCan.some(e => e.t <= ini)) {
    const seg = vend.filter(v => v.t <= segFim), L = seg.length ? seg[seg.length - 1].t : null;
    if (seg.length >= 2 && L != null) {
      const r0 = seg.length / ((segFim - ini) / DIA), gap = (segFim - L) / DIA;
      if (gap > Math.max(4, 3 / r0)) { vazio += segFim - L; if (!primeiro) { provVazia = true; vaziaDesde = L; } }
    }
  }
  const exp = Math.max(dias - vazio / DIA, 0);
  const taxa = n === 0 ? 0 : n / Math.max(exp, Math.min(7, dias));
  return { n, dias, exp, taxa, provVazia, vaziaDesde, ult, ini };
}

function estoqueEstimado(vm, can, fim, agora, taxa) {
  const evs = vm.eventos.filter(e => e.niveis && e.niveis[can] != null);
  if (!evs.length) return null;
  const e = evs[evs.length - 1];
  const vend = (vm.porCan[can] || []).filter(v => v.t > e.t && v.t <= fim).length;
  const proj = agora > fim ? taxa * (agora - Math.max(fim, e.t)) / DIA : 0;
  return { valor: Math.max(0, +e.niveis[can] - vend - proj), base: e.t, vendidas: vend, proj };
}

function fatorMes(cfg, t) { const k = minToIso(t).slice(0, 7); return (cfg.fatores && cfg.fatores[k]) || 1; }

// Plano completo de uma máquina para a próxima visita
function planoMaquina(st, m, agora) {
  const maq = st.maquinas[m], cfg = st.cfg, fim = fimDados(st);
  agora = agora || nowMin();
  const vm = vendasDaMaquina(st, m);
  const visita = maq.proximaVisita ? isoToMin(maq.proximaVisita) : agora;
  const intervalo = maq.intervaloDias || 7, margem = cfg.margemDias ?? 2;
  const fator = fatorMes(cfg, visita + DIA);
  const H = (intervalo + margem) * fator;
  const cans = canaletasDe(maq).map(c => {
    const prod = (maq.plano || {})[c.can] || null;
    const s = statsCanaleta(st, m, c.can, prod, vm, fim);
    let taxa = s.taxa, semHist = false;
    if (prod && s.n === 0 && !s.provVazia) {
      // produto novo nesta canaleta: usa a média por canaleta do mesmo produto (nesta máquina ou nas outras)
      const ref = mediaProduto(st, prod, m, fim);
      if (ref != null) taxa = ref; else semHist = true;
    }
    let est = estoqueEstimado(vm, c.can, fim, visita, taxa);
    if (!est && s.provVazia) est = { valor: 0, base: s.vaziaDesde, inferido: true };
    const zerada = !!(est && !est.inferido && est.valor < 0.5);
    const need = taxa * H;
    let alvo = !prod ? 0 : cfg.modo === 'cheio' ? c.cap : semHist ? Math.ceil(c.cap / 2) : Math.min(c.cap, Math.max(cfg.minExib ?? 4, Math.ceil(need)));
    const p = st.produtos[prod];
    if (p && p.premium && maq.semPremium) alvo = 0;
    const repor = est ? Math.max(0, Math.ceil(alvo - est.valor)) : alvo;
    const esvaziaEm = taxa > 0 ? c.cap / (taxa * fator) : null;
    return { ...c, prod, ...s, taxa, semHist, est, zerada, need, alvo, repor, esvaziaEm, bloqueado: !!(p && p.premium && maq.semPremium) };
  });
  // separação por produto
  const sep = {};
  for (const c of cans) if (c.prod && c.repor > 0) { const k = c.prod; sep[k] = sep[k] || { prod: k, qtd: 0, cans: [] }; sep[k].qtd += c.repor; sep[k].cans.push(c.can); }
  const alertas = [];
  for (const c of cans) {
    if (c.provVazia) alertas.push({ tipo: 'vazia', can: c.can, prod: c.prod, desde: c.vaziaDesde, perdidas: c.taxa * (fim - c.vaziaDesde) / DIA });
    else if (c.zerada) alertas.push({ tipo: 'zerada', can: c.can, prod: c.prod });
    else if (c.esvaziaEm != null && c.esvaziaEm < intervalo) alertas.push({ tipo: 'curta', can: c.can, prod: c.prod, dias: c.esvaziaEm });
    if (!c.provVazia && c.n === 0 && c.ult != null && c.ult < c.ini) alertas.push({ tipo: 'parada', can: c.can, prod: c.prod, desde: c.ult });
    if (c.bloqueado) alertas.push({ tipo: 'bloqueado', can: c.can, prod: c.prod });
    if (!c.prod) alertas.push({ tipo: 'semprod', can: c.can });
  }
  return { m, fim, visita, intervalo, margem, fator, H, cans, sep: Object.values(sep).sort((a, b) => b.qtd - a.qtd), alertas, temEventos: vm.eventos.length > 0 };
}

function mediaProduto(st, prod, mPref, fim) {
  const taxas = { pref: [], outras: [] };
  for (const m of Object.keys(st.maquinas)) {
    const maq = st.maquinas[m], vm = vendasDaMaquina(st, m);
    for (const c of canaletasDe(maq)) if ((maq.plano || {})[c.can] === prod) {
      const s = statsCanaleta(st, m, c.can, prod, vm, fim);
      if (s.n > 0) (m === mPref ? taxas.pref : taxas.outras).push(s.taxa);
    }
  }
  const a = taxas.pref.length ? taxas.pref : taxas.outras;
  return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
}

// Mix: quantas canaletas cada produto precisa em cada máquina
function mixMaquina(st, plano) {
  const maq = st.maquinas[plano.m], porTipo = {};
  for (const c of plano.cans) {
    const t = c.tipo; porTipo[t] = porTipo[t] || { tipo: t, total: 0, cap: c.cap, prods: {} };
    porTipo[t].total++;
    if (!c.prod) continue;
    const P = porTipo[t].prods[c.prod] = porTipo[t].prods[c.prod] || { prod: c.prod, cans: [], taxa: 0, vazias: 0 };
    P.cans.push(c.can); P.taxa += c.taxa; if (c.provVazia) P.vazias++;
  }
  for (const T of Object.values(porTipo)) {
    let soma = 0;
    T.lista = Object.values(T.prods).map(P => {
      const pr = st.produtos[P.prod] || {}; const lu = (pr.preco || 0) * (1 - TAXA) - (pr.custo || 0);
      P.lucroUn = lu; P.lucroDia = P.taxa * lu; P.lucroCan = P.lucroDia / P.cans.length;
      P.precisa = P.taxa * plano.intervalo * plano.fator / T.cap;
      P.sugerido = Math.max(1, Math.ceil(P.precisa - 0.15));
      soma += P.sugerido; return P;
    }).sort((a, b) => b.lucroDia - a.lucroDia);
    T.livres = T.total - soma;
  }

async function saveEvent(tipo) {
  const v = $('#evT').value; if (!v) return;
  const [dd, hh] = v.split('T'); const t = isoToMin(dd) + (+hh.slice(0, 2)) * 60 + (+hh.slice(3, 5));
  const niveis = {}, produtos = {};
  document.querySelectorAll('.evN').forEach(i => { if (i.value !== '') niveis[i.dataset.can] = Math.max(0, +i.value); });
  document.querySelectorAll('.evP').forEach(s => { if (s.value) produtos[s.dataset.can] = s.value; });
  if (!Object.keys(niveis).length) { $('#evMsg').textContent = 'Preencha ao menos uma mola.'; return; }
  $('#evMsg').textContent = 'Salvando…';
  try {
    await db.collection('eventos').add({ maq: sel, t, tipo, niveis, produtos });
    const maq = st.maquinas[sel], plano = { ...(maq.plano || {}) }; let mudou = false;
    document.querySelectorAll('.evP').forEach(s => { const k = s.dataset.can, nv = s.value || null; if ((plano[k] || null) !== nv) { plano[k] = nv; mudou = true; } });
    const upd = { plano };
    if (tipo === 'reposicao') { upd.proximaVisita = minToIso(t + (maq.intervaloDias || 7) * DIA); mudou = true; }
    if (mudou) await db.doc('maquinas/' + sel).update(upd);
    $('#sheet').classList.remove('on');
  } catch (e) { $('#evMsg').textContent = 'Não salvou: ' + (e.code || e.message || e); }
}

    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets['Dados']; if (!ws) throw new Error('aba Dados não encontrada');
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
    const h = rows[0].map(x => String(x || '').trim()), col = n => h.indexOf(n);
    const cD = col('Data'), cC = col('Canaleta'), cV = col('Valor'), cS = col('Shopping'), cI = col('Incluir?');
    if ([cD, cC, cV, cS].some(i => i < 0)) throw new Error('colunas esperadas não encontradas');
    const porNome = {}; for (const m of maqIds()) porNome[st.maquinas[m].nome] = m;
    const docs = {}; let fim = 0, n = 0;
    for (const r of rows.slice(1)) {
      if (typeof r[cD] !== 'number' || r[cC] == null || (cI >= 0 && r[cI] !== 'Sim')) continue;
      const m = porNome[r[cS]]; if (!m) continue;
      const t = Math.round((r[cD] - 46023) * 1440), mes = minToIso(t).slice(0, 7), k = m + '-' + mes;
      (docs[k] = docs[k] || { maq: m, mes, v: [] }).v.push([t, +r[cC], Math.round(+r[cV] * 100) / 100]); fim = Math.max(fim, t); n++;
    }
    const ate = toDate(fim).toISOString().slice(0, 16);
    for (const [k, d] of Object.entries(docs)) { d.v.sort((a, b) => a[0] - b[0]); msg.textContent = 'Gravando ' + k + '…'; await db.doc('vendas/' + k).set({ maq: d.maq, mes: d.mes, ate, f: d.v.flat() }); }
    msg.textContent = n + ' vendas importadas, até ' + fmtDH(fim) + '.';
  } catch (e) { msg.textContent = 'Não consegui importar: ' + (e.message || e.code || e); }
}

/* ---------- Eventos de interface ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.matches('.chip')) { sel = t.dataset.m; slotSel = null; try { localStorage.setItem('sq-maq', sel); } catch (x) {} renderNow(); }
  else if (t.matches('.slot')) { slotSel = slotSel === +t.dataset.can ? null : +t.dataset.can; renderNow(); }
  else if (t.id === 'copy') {
    const p = planoMaquina(st, sel, nowMin()), mq = st.maquinas[sel];
    const txt = `Reposição ${mq.nome}${mq.proximaVisita ? ' — ' + fmtDia(mq.proximaVisita) : ''}\n` + p.sep.map(s => `${s.qtd} × ${nomeP(s.prod)} (canaletas ${s.cans.join(', ')})`).join('\n');
    try { await navigator.clipboard.writeText(txt); t.textContent = 'Copiada'; } catch (x) { t.textContent = 'Não deu para copiar'; }
  }
  else if (t.id === 'copyLink') { try { await navigator.clipboard.writeText(location.origin + location.pathname + '?k=' + KEY); t.textContent = 'Link copiado'; } catch (x) { t.textContent = 'Não deu para copiar'; } }
  else if (t.id === 'regRep') openSheet('reposicao');
  else if (t.id === 'regCont') openSheet('contagem');
  else if (t.id === 'evCancel') $('#sheet').classList.remove('on');
  else if (t.id === 'evSave') saveEvent(t.dataset.tipo);
  else if (t.id === 'addGav') { const g = document.createElement('div'); g.className = 'gedit'; g.dataset.g = 'n'; g.innerHTML = '<input value="Nova gaveta" data-f="nome" aria-label="Nome"><select data-f="tipo" aria-label="Tipo"><option>Booster</option><option>Blister</option></select><input type="number" value="15" data-f="cap" aria-label="Capacidade"><input value="" data-f="can" aria-label="Canaletas">'; $('#gavs').appendChild(g); }
  else if (t.id === 'saveMaq') {
    const gavetas = [...document.querySelectorAll('#gavs .gedit')].map(r => ({ nome: r.querySelector('[data-f=nome]').value.trim(), tipo: r.querySelector('[data-f=tipo]').value, cap: +r.querySelector('[data-f=cap]').value || 1, can: r.querySelector('[data-f=can]').value.split(/[^0-9]+/).filter(Boolean).map(Number) })).filter(g => g.can.length);
    await db.doc('maquinas/' + sel).update({ gavetas, intervaloDias: +$('#intv').value || 7, semPremium: $('#semP').checked, layoutInferido: false });
    t.textContent = 'Salvo';
  }
  else if (t.id === 'saveCfg') {
    const fatores = { ...(st.cfg.fatores || {}), '2026-12': +$('#cDez').value || 1 };
    await db.doc('cfg/geral').set({ ...st.cfg, margemDias: +$('#cMarg').value, janelaDias: +$('#cJan').value || 21, minExib: +$('#cMin').value, modo: $('#cModo').value, fatores });
    t.textContent = 'Salvo';
  }
  else if (t.id === 'addProd') { const id = 'p' + Date.now().toString(36); await db.doc('produtos/' + id).set({ nome: 'Novo produto', curto: '', preco: 14.99, custo: 0, tipo: 'Booster', premium: false, ativo: true }); }
  else if (t.id === 'saveProd') {
    $('#pMsg').textContent = 'Salvando…';
    for (const tr of document.querySelectorAll('#ptab tbody tr')) {
      const id = tr.dataset.p, o = st.produtos[id], g = f => tr.querySelector(`[data-f=${f}]`);
      const nv = { ...o, nome: g('nome').value.trim(), curto: g('curto').value.trim(), preco: +g('preco').value, custo: +g('custo').value, tipo: g('tipo').value, premium: g('premium').checked, ativo: g('ativo').checked, estoqueLoja: g('estoqueLoja').value === '' ? null : +g('estoqueLoja').value };
      if (JSON.stringify(nv) !== JSON.stringify(o)) await db.doc('produtos/' + id).set(nv);
    }
    $('#pMsg').textContent = 'Salvo.';
  }
  else if (t.dataset.del) { t.textContent = 'Apagando…'; await db.doc('eventos/' + t.dataset.del).delete(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'visDate' && t.value) await db.doc('maquinas/' + sel).update({ proximaVisita: t.value });
  else if (t.id === 'slotProd') await db.doc('maquinas/' + sel).update({ plano: { [t.dataset.can]: t.value || null } });
  else if (t.id === 'xls' && t.files[0]) importar(t.files[0]);
  else if (t.id === 'seedF' && t.files.length) {
    const msg = $('#seedMsg');
    try {
      let s = null, v = null;
      for (const f of t.files) { const j = JSON.parse(await f.text()); if (Array.isArray(j)) v = j; else if (j.maquinas) s = j; }
      if (!s || !v) { msg.textContent = 'Selecione os dois arquivos juntos (seed.json e vendas_inicial.json).'; return; }
      await db.doc('cfg/geral').set(s.cfg);
      for (const [k, x] of Object.entries(s.produtos)) await db.doc('produtos/' + k).set(x);
      for (const x of v) { msg.textContent = 'Vendas ' + x.maq + ' ' + x.mes + '…'; await db.doc('vendas/' + x.maq + '-' + x.mes).set(x); }
      for (const [k, x] of Object.entries(s.maquinas)) await db.doc('maquinas/' + k).set(x);
    } catch (x) { msg.textContent = 'Falhou: ' + (x.code || x.message); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#sheet').classList.remove('on'); });
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('on'); });
window.addEventListener('hashchange', renderNow);

/* ---------- Dados (Firestore, acesso pelo código do link) ---------- */
let KEY = new URLSearchParams(location.search).get('k');
try { if (KEY) localStorage.setItem('sq-k', KEY); else KEY = localStorage.getItem('sq-k'); } catch (e) {}
const toTrip = f => { const v = []; for (let i = 0; i + 2 < f.length; i += 3) v.push([f[i], f[i + 1], f[i + 2]]); return v; };
if (!KEY) { $('#status').textContent = 'Abra o sistema pelo link que você recebeu (ele contém o código de acesso).'; }
else {
  const fdb = getFirestore(initializeApp(CFG)), base = 'equipes/' + KEY + '/';
  const mkDoc = p => { const r = doc(fdb, base + p); return { set: d => setDoc(r, d), update: d => setDoc(r, d, { merge: true }), delete: () => deleteDoc(r) }; };
  db = { doc: mkDoc, collection: c => ({ onSnapshot: (f, e) => onSnapshot(collection(fdb, base + c), f, e), add: d => addDoc(collection(fdb, base + c), d), doc: id => mkDoc(c + '/' + id) }) };
  timer = setTimeout(() => { if (!Object.values(loaded).every(Boolean)) $('#status').textContent = 'Os dados ainda não chegaram — verifique a conexão.'; }, 10000);
  const sub = (col, fn) => db.collection(col).onSnapshot(s => { fn(s); loaded[col] = 1; render(); }, err => { $('#status').textContent = err.code === 'permission-denied' ? 'Código de acesso inválido. Peça o link novamente.' : 'Erro ao ler ' + col + ': ' + err.code; });
  sub('cfg', s => { const d = s.docs.find(x => x.id === 'geral'); st.cfg = d ? d.data() : {}; });
  sub('maquinas', s => { st.maquinas = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); });
  sub('produtos', s => { st.produtos = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); });
  sub('vendas', s => { st.vendas = s.docs.map(d => { const x = d.data(); return { ...x, v: toTrip(x.f || []) }; }); });
  sub('eventos', s => { st.eventos = s.docs.map(d => ({ id: d.id, ...d.data() })); });
}
}
</script>
